name: Build ZYLO Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ZYLO debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Configure optional services
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ vars.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ vars.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          touch local.properties
          for key in TMDB_API_KEY NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY NUVIO_SUPABASE_FALLBACK_URL; do
            if [ -n "${!key}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> local.properties
            fi
          done
      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full --stacktrace
      - name: Prepare preview APK
        run: |
          mkdir -p release-output
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk release-output/ZYLO-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZYLO-Android-debug
          path: release-output/ZYLO-debug.apk
          if-no-files-found: error
          retention-days: 14
