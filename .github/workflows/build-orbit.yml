name: Build Orbit Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Orbit Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        run: |
          cat << 'EOF' > local.properties
          TMDB_API_KEY=b13994119d67b36f7ebbe344d5a9d8fa
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          NUVIO_SUPABASE_FALLBACK_URL=https://api.nuvio.tv
          EOF

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Prepare release binary
        run: |
          mkdir -p release-output
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk release-output/Orbit-v2.0.0-mobile.apk
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-v2.0.0-mobile
          path: release-output/Orbit-v2.0.0-mobile.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0.0 --yes || true
          gh release create v2.0.0 \
            release-output/Orbit-v2.0.0-mobile.apk \
            --title "Orbit v2.0.0 - Nuvio Powered" \
            --notes "### Orbit v2.0.0 Release (Nuvio Media Powered)
          
          - **New High-End UI**: Powered by Nuvio Mobile (Compose Multiplatform)
          - **Full Catalog & Addons**: Cinemeta, Torrentio & CyberFlix integration
          - **Authentication & Sync**: Multi-device continue watching & library sync via Supabase
          - **Strict Gmail Access**: @gmail.com accounts only
          - **Full Cast & Details**: Person detail screens with complete actor filmographies
          - **Orbit Cosmic Branding**: Cosmic Orbit logos, icons and wordmarks"
