name: ZYLO Web verification
on:
  push:
    branches: [main, work/zylo-web-import]
    paths:
      - "website/**"
      - ".github/workflows/build-zylo-web.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/build-zylo-web.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Verify account identity and watch progress reconciliation
        run: node --test js/core/app/appIdentity.test.mjs js/core/profile/watchProgressMerge.test.mjs js/core/profile/watchProgressSync.twoDevice.test.mjs
      - name: Verify external navigation is not probed as media
        run: node --test --test-name-pattern="external navigation-only" js/core/player/probeStreamCandidate.test.mjs
      - name: Verify full cast metadata
        run: node --test js/ui/screens/detail/castCompleteness.test.mjs
      - name: Verify QR login rendering
        run: node --test js/ui/screens/account/authQrSignInScreen.test.mjs
      - name: Verify branding and distribution metadata
        run: node --test js/ui/screens/settings/settingsScreen.browser.test.mjs scripts/appMetadata.test.mjs scripts/releaseDistributionConfig.test.mjs
      - name: Verify browser navigation and refresh policy
        run: node --test js/ui/navigation/browserRouteUrl.test.mjs
      - name: Verify regional catalogs and official edition discovery
        run: node --test js/core/tmdb/tmdbDiscover.test.mjs js/core/tmdb/verifiedEditions.test.mjs js/data/repository/catalogRepository.test.mjs js/ui/screens/home/guestHomeData.test.mjs
      - name: Verify startup loading timeout and exit
        run: node --test js/ui/components/startupLoadingOverlay.test.mjs
      - name: Build production web assets
        run: |
          node scripts/zylo-vercel-build.mjs
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q '<title>ZYLO</title>' dist/index.html
