name: Remove legacy Railway deployment records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-deployments.yml'
permissions:
  contents: read
  deployments: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the two requested GitHub deployment records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=anshdeepofficial1/ZYLO
          records="$(gh api --paginate --slurp "repos/$repo/deployments?per_page=100" | jq 'add // []')"
          echo "$records" | jq -r '.[] | [.id, .sha, .environment, .creator.login] | @tsv'
          for prefix in 55638a386151157ca 6e042f97ad91a9bf6; do
            matches="$(jq --arg prefix "$prefix" '[.[] | select((.sha | startswith($prefix)) and (.environment | contains("bountiful-flexibility")) and (.environment | contains("production")))]' <<< "$records")"
            count="$(jq length <<< "$matches")"
            if [ "$count" -eq 0 ]; then
              echo "No matching deployment remains for $prefix"
              continue
            fi
            if [ "$count" -ne 1 ]; then
              echo "Ambiguous match for $prefix; refusing deletion"
              exit 1
            fi
            id="$(jq -r '.[0].id' <<< "$matches")"
            status="$(gh api "repos/$repo/deployments/$id/statuses?per_page=1" --jq '.[0].state // "unknown"')"
            if [ "$status" != inactive ]; then
              gh api --method POST "repos/$repo/deployments/$id/statuses" -f state=inactive -F auto_inactive=false >/dev/null
            fi
            gh api --method DELETE "repos/$repo/deployments/$id"
            echo "Deleted GitHub deployment record $id ($prefix)"
          done
          gh api --paginate --slurp "repos/$repo/deployments?per_page=100" | jq -e 'add // [] | all(.[]; ((.sha | startswith("55638a386151157ca") or startswith("6e042f97ad91a9bf6")) | not))'
